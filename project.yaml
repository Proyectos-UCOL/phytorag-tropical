version: "2.0.0"
project_id: "phytorag-tropical"
# Título y revista provisionales; se confirman antes de redactar el manuscrito (ver issue #9).
title: "PhytoRAG-Tropical: A Hybrid Retrieval-Augmented Generation Architecture with Deterministic Regulatory Guardrails for Zero-Hallucination Phytosanitary Dosage in Tropical Agriculture"
target_venue: "Computers and Electronics in Agriculture"
authors:
  - "Carlos Flores-Cortés"
  - "Ricardo Mercado López"
  - "Sofía Renata Silva Méndez"

thesis:
  research_question: "¿Cuánto reducen la recuperación de fichas verificadas y los candados deterministas los errores de dosis y las recomendaciones fuera de etiqueta de un modelo de lenguaje, en consultas fitosanitarias de limón, mango y papaya?"
  secondary_questions:
    - "¿Qué aporta cada pieza por separado: la búsqueda semántica, la búsqueda léxica y los candados?"
    - "¿Sabe el sistema abstenerse cuando la respuesta no está en su corpus o la consulta parte de una premisa falsa?"
  framing: "El aporte es un diseño donde el modelo no genera los campos regulados (registro, dosis, intervalo de seguridad): salen de la ficha verificada. Se mide cuánto falla un modelo cuando sí los genera (M1 a M3) y cuánto deja de fallar cuando no (M4)."
  key_contributions:
    - "Corpus de fichas fitosanitarias con evidencia por campo, trazabilidad por hash y aprobación humana."
    - "Banco de 100 consultas derivadas del corpus, en cinco tipos: con respuesta, cultivo no autorizado, régimen orgánico, sin respuesta y premisa falsa."
    - "Comparación de cuatro arquitecturas (M1 a M4) con métricas deterministas, intervalos de confianza y pruebas pareadas."

experimental_stack:
  target_crops:
    - "Limonero (limón mexicano, Citrus aurantifolia)"
    - "Mango (Mangifera indica)"
    - "Papayo (Carica papaya)"
  corpus:
    target_approved_records: 20
    evidence_criterion: "Etiqueta publicada por el fabricante (titular del registro) con SHA-256, consulta de COFEPRIS que confirma registro, ingrediente, cultivo y vigencia, y aprobación humana."
  benchmark:
    queries: 100
    phrasings_per_query: 2
    types:
      - "A: con respuesta (40)"
      - "B: cultivo no autorizado (20)"
      - "C: régimen orgánico (15)"
      - "D: sin respuesta en el corpus (15)"
      - "E: premisa falsa (10)"
  models_under_evaluation:
    generator: "gemini-3.5-flash-lite"
    repetitions: 3
    rag_architectures:
      - "M1: LLM directo, sin recuperación"
      - "M2: RAG vectorial denso (ChromaDB)"
      - "M3: RAG híbrido (BM25 + ChromaDB, fusión RRF)"
      - "M4: RAG híbrido + guardrails deterministas (filtro por cultivo y régimen; campos regulados desde la ficha)"
  metrics:
    - "Registro COFEPRIS correcto"
    - "Dosis correcta"
    - "Intervalo de seguridad correcto"
    - "Recomendación fuera de etiqueta (%)"
    - "Violación de régimen orgánico (%)"
    - "Abstención correcta e indebida"
    - "Recuperación de la ficha esperada"
    - "Intervalos de confianza al 95% por bootstrap y prueba exacta de McNemar"
    - "Costo y tiempo por consulta"
  optional_metrics:
    - "Faithfulness (RAGAS) sobre una muestra"
  out_of_scope_article_1:
    - "Re-ranking (BGE / Cohere)"
    - "Comparación de modelos de embeddings"
    - "Régimen de exportación (LMR de EPA / USDA)"
    - "Interfaz web"
    - "Validación con agrónomos o productores"

literature_mission:
  area: "Retrieval-Augmented Generation, Phytosanitary Compliance and Hallucination Mitigation in Agriculture"
  min_year: 2023
  daily_target: 3
  total_cumulative_target: 27
  search_axes:
    - "Eje 1: Retrieval-Augmented Generation (RAG) and hybrid search in agriculture"
    - "Eje 2: Hallucination mitigation and numerical accuracy in domain-specific LLMs"
    - "Eje 3: Regulatory compliance and automated vademecum query systems"
    - "Eje 4: RAG evaluation frameworks (RAGAS, TruLens) in high-stakes domains"
  initial_search_terms:
    - "retrieval augmented generation agriculture pest management"
    - "hybrid search BM25 vector embeddings agricultural RAG"
    - "LLM hallucination mitigation numerical dosage chemical"
    - "regulatory compliance AI pesticide vademecum"
    - "RAGAS evaluation domain specific question answering"

workflow_guardrails:
  max_review_rounds: 2
  min_passing_score: 7.0
  circuit_breaker_threshold: 6.0
  word_count_limits:
    total: 8000
